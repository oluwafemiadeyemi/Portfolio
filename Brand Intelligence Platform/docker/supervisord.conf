[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
loglevel=info

[program:api]
command=python -m uvicorn api.main:app --host 0.0.0.0 --port %(ENV_API_PORT)s --log-level %(ENV_LOG_LEVEL)s
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log
environment=PYTHONPATH="/app"

[program:dashboard]
command=python -m streamlit run dashboard/app.py --server.port %(ENV_DASHBOARD_PORT)s --server.address 0.0.0.0 --server.headless true --server.enableCORS false
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/dashboard.err.log
stdout_logfile=/var/log/supervisor/dashboard.out.log
environment=PYTHONPATH="/app"
