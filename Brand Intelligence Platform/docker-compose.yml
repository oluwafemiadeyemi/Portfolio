version: "3.9"

# ============================================================
# Enterprise Brand Intelligence Platform — Docker Compose
# Services: api (port 8000), dashboard (port 8501)
# ============================================================

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: brand-intelligence-api:latest
    container_name: brand_intelligence_api
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - LOG_LEVEL=info
      - PYTHONPATH=/app
    volumes:
      - brand_data:/app/data
    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - brand_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: brand-intelligence-dashboard:latest
    container_name: brand_intelligence_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - DASHBOARD_PORT=8501
      - PYTHONPATH=/app
    volumes:
      - brand_data:/app/data
    command: >
      python -m streamlit run dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - brand_net

volumes:
  brand_data:
    driver: local

networks:
  brand_net:
    driver: bridge
